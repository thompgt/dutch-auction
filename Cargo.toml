[workspace]
resolver = "2"
members = [
    "crates/auction-proto",
    "crates/auction-core",
    "crates/auction-wal",
    "crates/auction-engine",
    "crates/auction-gateway",
    "crates/auction-projector",
    "load",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
repository = "https://github.com/thomas/dutch-auction"

[workspace.dependencies]
# Internal
auction-proto = { path = "crates/auction-proto" }
auction-core = { path = "crates/auction-core" }
auction-wal = { path = "crates/auction-wal" }
auction-engine = { path = "crates/auction-engine" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Async runtime and network edge
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Concurrency
crossbeam-channel = "0.5"
dashmap = "6"
parking_lot = "0.12"
smallvec = { version = "1", features = ["serde", "union"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono"] }

# Errors and utilities
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }

# Testing
proptest = "1"
criterion = "0.5"
hdrhistogram = "7"

[profile.release]
# The tail is the product. Optimize for predictable latency, not just throughput.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1 # keep symbols so production flamegraphs are readable

[profile.bench]
inherits = "release"
debug = true
